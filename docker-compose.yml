version: "3.9"

services:
    # Base de données PostgreSQL
    db:
        image: postgres:16-alpine
        container_name: erProjects-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: erProjects
            POSTGRES_PASSWORD: ${DB_PASSWORD:-erProjects_password}
            POSTGRES_DB: erProjects
        volumes:
            - erProjects_db_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U erProjects -d erProjects"]
            interval: 5s
            timeout: 5s
            retries: 10

    # Backend API (Node.js + Express + Prisma)
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: erProjects-backend
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        environment:
            PORT: "3001"
            NODE_ENV: production
            DATABASE_URL: postgresql://erProjects:${DB_PASSWORD:-erProjects_password}@db:5432/erProjects
            SESSION_SECRET: ${SESSION_SECRET:-change-this-secret-min-16-chars}
            SESSION_MAX_AGE: "86400000"
            UPLOAD_DIR: /app/uploads
            MAX_UPLOAD_SIZE: "52428800"
            BACKUP_DIR: /app/backups
            BACKUP_HOUR: "3"
            ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@erProjects.local}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
        volumes:
            - erProjects_uploads:/app/uploads
            - erProjects_backups:/app/backups
        ports:
            - "3001:3001"

    # Frontend React (servi par Nginx avec proxy vers le backend)
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: erProjects-frontend
        restart: unless-stopped
        depends_on:
            - backend
        ports:
            - "80:80"

volumes:
    erProjects_db_data:
    erProjects_uploads:
    erProjects_backups:
